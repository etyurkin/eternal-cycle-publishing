name: Validate readers and deploy gallery
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eternal-cycle-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF validation dependency
        run: python -m pip install --requirement requirements-validation.txt
      - name: Run publication and gallery regression tests
        run: python -m unittest discover -s tests -v
      - name: Check deterministic catalog and ZIPs
        run: python scripts/build_catalog.py --check
      - name: Check reader files and download links
        run: python scripts/verify_reader_files.py
      - name: Audit EPUB chapters, metadata, internal links and covers
        run: python scripts/audit_epub_contents.py
      - name: Require exact approved mobile PDFs
        run: python scripts/verify_mobile_readers.py
      - name: Build allowlisted bilingual gallery
        run: python scripts/build_gallery.py --output _site
      - name: Confirm validation did not change committed files
        run: git diff --exit-code
      - name: Package Pages output only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
