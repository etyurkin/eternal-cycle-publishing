name: Prepare Unconscious Programming mobile editions
on:
  push:
    branches: [publish-unconscious-programming]
    paths:
      - '.github/workflows/build-unconscious.yml'
      - 'scripts/publish_unconscious_programming.py'
      - 'tests/test_gallery.py'
      - 'books/technology/other/unconscious-programming/**'
permissions:
  contents: write
concurrency:
  group: unconscious-reader-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/publish-unconscious-programming'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install mobile layout and verification dependencies
        run: python -m pip install weasyprint==68.0 Pillow==12.0.0 -r requirements-validation.txt
      - name: Render and verify 90 x 160 mm mobile editions
        run: python scripts/publish_unconscious_programming.py
      - name: Test book gallery and export safeguards
        run: python -m unittest discover -s tests -v
      - name: Commit approved bilingual readers and gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/technology/other/unconscious-programming \
            catalog.json gallery/books.json gallery/assets/covers \
            mobile-readers.json reader-files.sha256 README.md README.en.md README.ru.md
          if git diff --cached --quiet; then
            echo "Approved readers are already current; nothing to commit."
            exit 0
          fi
          git commit -m "publish: verified Unconscious Programming RU and EN mobile editions"
          git push origin HEAD:$GITHUB_REF_NAME
