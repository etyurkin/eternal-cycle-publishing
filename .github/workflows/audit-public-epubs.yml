name: Audit public EPUB reading editions
on:
  push:
    branches: [main, repair-public-epub-readers]
    paths:
      - '.github/workflows/audit-public-epubs.yml'
      - 'scripts/audit_epub_contents.py'
      - 'tests/test_workflow_safety.py'
      - 'requirements-validation.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: epub-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  epub-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Verify existing catalogues and deterministic reader ZIPs
        run: python scripts/build_catalog.py --check
      - name: Validate public EPUB content and all internal references
        run: python scripts/audit_epub_contents.py
      - name: Verify reader files and existing phone-size PDFs
        run: |
          python scripts/verify_reader_files.py
          python scripts/verify_mobile_readers.py
      - name: Run all gallery and workflow regression tests
        run: python -m unittest discover -s tests -v
